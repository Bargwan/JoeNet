[project]
name = "joenet"
version = "0.1.0"
description = "AI agents for the multiplayer imperfect-information Rummy variant 'Joe', building towards a BayesianAgent that tracks beliefs about hidden cards."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "python-statemachine>=3.0.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
# Standard line length; 88 is Black's default, but 100 gives a bit more breathing room
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Enable standard rule groups:
# E: pycodestyle errors
# F: Pyflakes (catches unused variables/imports)
# I: isort (automatically sorts imports)
# B: flake8-bugbear (finds common logic bugs)
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
# Standardize formatting to match the 'Black' style
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
pythonpath = ["."]
# Silence the terminal output
log_cli = false

# Route all logging across the entire project into the logs folder
log_file = "logs/tests.log"
log_file_level = "WARNING"
log_file_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
